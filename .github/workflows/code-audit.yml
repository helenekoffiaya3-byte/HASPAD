name: HASPAD code audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find netlify/functions runtime/worker public/js -type f -name '*.js' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Checking $file"
            cp "$file" /tmp/haspad-syntax-check.mjs
            node --check /tmp/haspad-syntax-check.mjs
          done
      - name: Validate package JSON
        run: |
          node -e "for (const f of ['package.json','runtime/worker/package.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log(f + ' OK') }"
      - name: Install HASPAD dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run HASPAD build
        run: npm run build
      - name: Verify Netlify function routes are unique
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='netlify/functions';
          const routes=new Map();
          function walk(dir){
            for(const name of fs.readdirSync(dir)){
              const p=path.join(dir,name),s=fs.statSync(p);
              if(s.isDirectory()) walk(p);
              else if(name.endsWith('.js')){
                const text=fs.readFileSync(p,'utf8');
                const m=text.match(/config\\s*=\\s*\\{\\s*path:\\s*["']([^"']+)["']/);
                if(m){
                  const prev=routes.get(m[1]);
                  if(prev) throw new Error(`Duplicate function route ${m[1]}: ${prev} and ${p}`);
                  routes.set(m[1],p);
                }
              }
            }
          }
          walk(root);
          console.log(`Verified ${routes.size} explicit function routes.`);
          NODE
