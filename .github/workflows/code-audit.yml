name: HASPAD code audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find netlify/functions runtime/worker public/js -type f -name '*.js' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Checking $file"
            cp "$file" /tmp/haspad-syntax-check.mjs
            node --check /tmp/haspad-syntax-check.mjs
          done
      - name: Validate package JSON
        run: |
          node -e "for (const f of ['package.json','runtime/worker/package.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log(f + ' OK') }"
