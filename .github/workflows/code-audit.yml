name: HASPAD code audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          find netlify/functions runtime/worker public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate package JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('runtime/worker/package.json','utf8')); console.log('package.json OK')"
