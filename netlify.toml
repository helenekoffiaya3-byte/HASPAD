[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/domain-availability"
  to = "/.netlify/functions/domain-availability"
  status = 200
[[redirects]]
  from = "/api/domain-pricing"
  to = "/.netlify/functions/domain-pricing"
  status = 200
[[redirects]]
  from = "/api/configure-domain"
  to = "/.netlify/functions/configure-domain"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200
[[redirects]]
  from = "/editor"
  to = "/editor.html"
  status = 200
[[redirects]]
  from = "/control-center"
  to = "/control-center.html"
  status = 200
[[redirects]]
  from = "/settings"
  to = "/settings.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200
[[redirects]]
  from = "/pricing"
  to = "/dashboard.html#pricing"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# GitHub -> Netlify deployment source
[build.environment]
  NODE_VERSION = "22"
