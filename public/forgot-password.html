<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Récupération — HASPAD</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-shell"><a class="brand" href="/">HASPAD.com</a><section class="auth-card"><div class="eyebrow">Sécurité du compte</div><h1>Mot de passe oublié</h1><p class="subtitle">Entrez votre adresse email. Si elle correspond à un compte HASPAD, Netlify Identity vous enverra le lien de récupération.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required></label><button id="submit" class="primary" type="submit">Envoyer le lien</button></form><p id="message" class="message" role="alert"></p><p class="switch"><a href="/connexion.html">Retour à la connexion</a></p></section></main><script type="module">import{initAuth}from"/js/auth.js";import{requestPasswordRecovery}from"https://cdn.jsdelivr.net/npm/@netlify/identity@2.0.0/+esm";await initAuth();const form=document.querySelector("#form"),email=document.querySelector("#email"),submit=document.querySelector("#submit"),message=document.querySelector("#message");form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;message.className="message";message.textContent="";try{await requestPasswordRecovery(email.value.trim());message.className="message success";message.textContent="Si cette adresse correspond à un compte, un email de récupération a été envoyé."}catch(err){message.textContent=err?.message||"Impossible d'envoyer le lien de récupération."}finally{submit.disabled=false}});</script></body></html>
