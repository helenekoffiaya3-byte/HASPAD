<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe — HASPAD</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-shell"><a class="brand" href="/">HASPAD.com</a><section class="auth-card"><h1>Nouveau mot de passe</h1><p id="msg">Traitement du lien…</p><form id="form" hidden><label>Nouveau mot de passe<input id="password" type="password" minlength="10" maxlength="128" required></label><button class="primary">Enregistrer</button></form></section></main><script type="module">import{handleAuthCallback,updateUser}from"https://cdn.jsdelivr.net/npm/@netlify/identity@2.0.0/+esm";const msg=document.querySelector("#msg"),form=document.querySelector("#form");try{const result=await handleAuthCallback();if(result?.type==="recovery"){msg.textContent="Choisissez votre nouveau mot de passe.";form.hidden=false}else{msg.textContent="Lien de récupération invalide ou expiré."}}catch{msg.textContent="Lien de récupération invalide ou expiré."}form.onsubmit=async e=>{e.preventDefault();try{await updateUser({password:document.querySelector("#password").value});msg.textContent="Mot de passe mis à jour.";form.hidden=true;setTimeout(()=>location.href="/dashboard.html",700)}catch{msg.textContent="Impossible de modifier le mot de passe."}};</script></body></html>
