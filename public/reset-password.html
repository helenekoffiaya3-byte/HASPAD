<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe — HASPАD</title><link rel="stylesheet" href="/css/style.css"></head><body><main><section class="panel"><h1>Nouveau mot de passe</h1><form id="form"><input id="password" type="password" minlength="10" maxlength="128" placeholder="Nouveau mot de passe" required><button>Enregistrer</button></form><p id="msg"></p></section></main><script type="module">
const msg=document.querySelector("#msg"),form=document.querySelector("#form");
try{
 const cfg=await (await fetch("/api/auth/config")).json();
 const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
 const supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
 form.onsubmit=async e=>{e.preventDefault();const password=document.querySelector("#password").value;if(password.length<10){msg.textContent="Minimum 10 caractères.";return;}const {error}=await supabase.auth.updateUser({password});if(error){msg.textContent="Impossible de modifier le mot de passe.";return;}await supabase.auth.signOut();msg.textContent="Mot de passe mis à jour. Vous pouvez vous reconnecter.";setTimeout(()=>location.href="/auth.html",1000);};
}catch{msg.textContent="Lien de réinitialisation invalide ou expiré."}
</script></body></html>
