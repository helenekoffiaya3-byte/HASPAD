<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — HASPAD</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-shell"><a class="brand" href="/">HASPAD.com</a><section class="auth-card"><div class="eyebrow">Espace HASPAD</div><h1>Connexion</h1><p class="subtitle">Accédez à votre espace de création et de gestion de sites.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="vous@exemple.com"></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label><button id="submit" class="primary" type="submit">Se connecter</button></form><p id="message" class="message" role="alert"></p><div class="divider"><span>ou</span></div><div class="sso"><button data-provider="google" type="button">Continuer avec Google</button><button data-provider="github" type="button">Continuer avec GitHub</button><button data-provider="gitlab" type="button">Continuer avec GitLab</button><button data-provider="bitbucket" type="button">Continuer avec Bitbucket</button></div><p class="switch">Pas encore de compte ? <a href="/inscription.html">Créer un compte</a></p><a class="forgot" href="/reset-password.html">Mot de passe oublié ?</a></section></main><script type="module">import{setSession}from"/js/auth.js";const form=document.querySelector("#loginForm"),message=document.querySelector("#message"),submit=document.querySelector("#submit");form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="";message.className="message";submit.disabled=true;submit.textContent="Connexion…";try{const r=await fetch("/api/auth-login",{method:"POST",headers:{"content-type":"application/json"},credentials:"include",body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json().catch(()=>({}));if(!r.ok){message.textContent=d.error||"Identifiants incorrects.";return}setSession(d);message.className="message success";message.textContent="Connexion réussie.";setTimeout(()=>location.href="/",400)}catch{message.textContent="Impossible de joindre le serveur."}finally{submit.disabled=false;submit.textContent="Se connecter"}});document.querySelectorAll("[data-provider]").forEach(b=>b.onclick=()=>location.href="/api/auth-oauth?provider="+encodeURIComponent(b.dataset.provider));</script></body></html>
