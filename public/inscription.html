<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription — HASPAD</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-shell"><a class="brand" href="/">HASPAD.com</a><section class="auth-card"><div class="eyebrow">Commencer avec HASPAD</div><h1>Créer un compte</h1><p class="subtitle">Créez votre compte et préparez votre premier espace.</p><form id="registerForm"><label>Nom complet<input id="fullName" type="text" autocomplete="name" maxlength="255" placeholder="Votre nom"></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Mot de passe<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>Nom du premier site <span class="optional">facultatif</span><input id="siteName" type="text" maxlength="255" placeholder="Mon premier site"></label><button id="submit" class="primary" type="submit">Créer mon compte</button></form><p id="message" class="message" role="alert"></p><div class="divider"><span>ou</span></div><div class="sso"><button data-provider="google" type="button">Continuer avec Google</button><button data-provider="github" type="button">Continuer avec GitHub</button><button data-provider="gitlab" type="button">Continuer avec GitLab</button><button data-provider="bitbucket" type="button">Continuer avec Bitbucket</button></div><p class="switch">Vous avez déjà un compte ? <a href="/connexion.html">Se connecter</a></p></section></main><script type="module">import{initAuth}from"/js/auth.js";import{signup,oauthLogin}from"https://cdn.jsdelivr.net/npm/@netlify/identity@2.0.0/+esm";const callback=await initAuth();if(callback?.user)location.href="/dashboard.html";const form=document.querySelector("#registerForm"),message=document.querySelector("#message"),submit=document.querySelector("#submit");form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;message.textContent="";try{const user=await signup(email.value.trim(),password.value,{full_name:fullName.value.trim()||null,site_name:siteName.value.trim()||"Mon Premier Site"});if(user?.confirmed_at){message.textContent="Compte créé.";setTimeout(()=>location.href="/dashboard.html",500)}else{message.textContent="Compte créé. Vérifiez votre email pour activer le compte."}}catch(err){message.textContent=err?.message||"Impossible de créer le compte."}finally{submit.disabled=false}});document.querySelectorAll("[data-provider]").forEach(b=>b.onclick=()=>oauthLogin(b.dataset.provider));</script></body></html>
