<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription — HASPAD</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-shell"><a class="brand" href="/">HASPAD.com</a><section class="auth-card"><div class="eyebrow">Commencer avec HASPAD</div><h1>Créer un compte</h1><p class="subtitle">Créez votre compte et préparez votre premier espace.</p><form id="registerForm"><label>Nom complet<input id="fullName" type="text" autocomplete="name" maxlength="255" placeholder="Votre nom"></label><label>Email<input id="email" type="email" autocomplete="email" required placeholder="vous@exemple.com"></label><label>Mot de passe<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="10 caractères minimum"></label><label>Nom du premier site <span class="optional">facultatif</span><input id="siteName" type="text" maxlength="255" placeholder="Mon premier site"></label><button id="submit" class="primary" type="submit">Créer mon compte</button></form><p id="message" class="message" role="alert"></p><div class="divider"><span>ou</span></div><div class="sso"><button data-provider="google" type="button">Continuer avec Google</button><button data-provider="github" type="button">Continuer avec GitHub</button></div><p class="switch">Vous avez déjà un compte ? <a href="/connexion.html">Se connecter</a></p></section></main><script type="module">import{setSession}from"/js/auth.js";const form=document.querySelector("#registerForm"),message=document.querySelector("#message"),submit=document.querySelector("#submit");form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="";message.className="message";submit.disabled=true;submit.textContent="Création…";try{const r=await fetch("/api/auth-register",{method:"POST",headers:{"content-type":"application/json"},credentials:"include",body:JSON.stringify({fullName:fullName.value,email:email.value,password:password.value,siteName:siteName.value})}),d=await r.json().catch(()=>({}));if(!r.ok){message.textContent=d.error||"Impossible de créer le compte.";return}if(d.accessToken)setSession(d);message.className="message success";message.textContent=d.emailVerificationRequired?"Compte créé. Vérifiez votre email pour continuer.":"Compte créé avec succès.";setTimeout(()=>location.href=d.accessToken?"/":"/connexion.html",900)}catch{message.textContent="Impossible de joindre le serveur."}finally{submit.disabled=false;submit.textContent="Créer mon compte"}});document.querySelectorAll("[data-provider]").forEach(b=>b.onclick=()=>location.href="/api/auth-oauth?provider="+encodeURIComponent(b.dataset.provider));</script></body></html>
