<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — HASPАD</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main><h1>HASPАD</h1><section class="panel"><h2 id="title">Connexion</h2><form id="authForm"><input id="name" placeholder="Nom complet" autocomplete="name" hidden><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required><input id="siteName" placeholder="Nom du premier site" hidden><button type="submit">Continuer</button></form><p id="message"></p><div class="actions"><button id="toggle" type="button">Créer un compte</button><button data-provider="google" type="button">Google</button><button data-provider="github" type="button">GitHub</button><button data-provider="gitlab" type="button">GitLab</button><button data-provider="bitbucket" type="button">Bitbucket</button></div><a href="/api/auth/forgot-password">Mot de passe oublié ?</a></section></main>
<script type="module">
import {setSession} from "/js/auth.js";
let register=false;const form=document.querySelector("#authForm"),title=document.querySelector("#title"),toggle=document.querySelector("#toggle"),message=document.querySelector("#message"),name=document.querySelector("#name"),site=document.querySelector("#siteName");
toggle.onclick=()=>{register=!register;title.textContent=register?"Inscription":"Connexion";toggle.textContent=register?"J'ai déjà un compte":"Créer un compte";name.hidden=!register;site.hidden=!register;document.querySelector("#password").autocomplete=register?"new-password":"current-password";};
form.onsubmit=async e=>{e.preventDefault();message.textContent="";const path=register?"/api/auth/register":"/api/auth/login";const body={email:document.querySelector("#email").value,password:document.querySelector("#password").value};if(register){body.fullName=name.value;body.siteName=site.value;}const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},credentials:"include",body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){message.textContent=d.error||"Erreur d'authentification.";return;}if(d.accessToken)setSession(d);message.textContent=d.emailVerificationRequired?"Vérifiez votre email pour activer le compte.":"Connexion réussie.";};
document.querySelectorAll("[data-provider]").forEach(b=>b.onclick=()=>{location.href="/api/auth/oauth?provider="+encodeURIComponent(b.dataset.provider);});
</script></body></html>
