<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HASPAD — Vérification du paiement</title>
<style>
body{font-family:system-ui,sans-serif;max-width:680px;margin:15vh auto;padding:24px;color:#111;text-align:center}
h1{font-size:28px}.status{padding:18px;border-radius:14px;background:#f4f4f5;margin:24px 0}
a{display:inline-block;padding:12px 18px;background:#06f;color:#fff;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<h1>HASPAD</h1>
<div id="status" class="status">Vérification sécurisée de votre paiement…</div>
<a href="/dashboard.html">Retour au tableau de bord</a>
<script>
(async()=>{
 const box=document.getElementById("status");
 const tx=new URLSearchParams(location.search).get("transaction_id");
 const token=localStorage.getItem("haspad_access_token");
 if(!tx){box.textContent="Transaction introuvable.";return;}
 if(!token){box.textContent="Session expirée. Connectez-vous pour vérifier le paiement.";return;}
 try{
   const res=await fetch("/.netlify/functions/payment-verify",{
     method:"POST",
     headers:{"content-type":"application/json","authorization":"Bearer "+token},
     body:JSON.stringify({transactionId:tx})
   });
   const data=await res.json();
   if(data.success){
     box.textContent="Paiement confirmé. "+(data.creditsAdded||0)+" crédits ont été attribués à votre compte.";
     setTimeout(()=>location.href="/dashboard.html?payment=success",1200);
   }else{
     box.textContent="Paiement actuellement : "+(data.status||"en vérification")+". Le webhook CinetPay peut encore finaliser l'attribution.";
   }
 }catch(e){box.textContent="Vérification temporairement indisponible. Votre paiement reste traçable.";console.error(e);}
})();
</script>
</body>
</html>
